[observability]
logger_level = "%{LOG_LEVEL|info}"
kameo_console_listen_address = "%{KAMEO_CONSOLE_LISTEN_ADDRESS|0.0.0.0:9999}"

[bus]
server_address = "%{BUS_SERVER|localhost:1883}"

[web]
listen_address = "0.0.0.0:%{WEB_PORT|80}"

[git]
app_url = "%{GIT_APP_URL|}"

ssh_key = "%{GIT_SSH_KEY|/ssh_key}"
ssh_key_passphrase = "%{GIT_SSH_KEY_PASSPHRASE|}"
username = "%{GIT_USERNAME|}"
token = "%{GIT_TOKEN|}"

accept_unknown_host = true

[paths]
root = "%{PATH_ROOT|/data}"

[paths.project_manager]
ui = "ui-projects"
core = "core-projects"
